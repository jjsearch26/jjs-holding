const portrait=window.matchMedia('(max-width:900px) and (orientation:portrait)');
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
const video=document.getElementById('reception-video');
const film=document.getElementById('film');
const button=document.getElementById('motion-button');
const status=document.getElementById('status');
let requested=!reduce.matches;
let blocked=false;
let pending=false;
let currentMode='';
let objectURL=null;

video.muted=true;
video.defaultMuted=true;
video.playsInline=true;
video.loop=true;
video.setAttribute('muted','');
video.setAttribute('playsinline','');
video.setAttribute('webkit-playsinline','');

function b64ToURL(data){
  const binary=atob(data);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));
}
function sync(){
  button.textContent=video.paused?'Play video':'Pause video';
  button.setAttribute('aria-label',video.paused?'Play silent background video':'Pause background video');
}
function play(explicit){
  if(pending||video.error||document.hidden||(!explicit&&(!requested||blocked)))return;
  pending=true;
  video.muted=true;
  const p=video.play();
  if(p&&typeof p.then==='function'){
    p.then(function(){pending=false;sync();}).catch(function(error){
      pending=false;
      if(error&&error.name==='AbortError')return;
      blocked=true;
      film.classList.remove('is-playing');
      status.textContent='The still image is shown. Use Play video to start the silent film.';
      sync();
    });
  }else{pending=false;sync();}
}
function loadForViewport(){
  const mode=portrait.matches?'mobile':'desktop';
  if(mode===currentMode&&video.src)return;
  currentMode=mode;
  const shouldResume=requested&&!document.hidden;
  video.pause();
  film.classList.remove('is-playing');
  pending=false;
  blocked=false;
  if(objectURL)URL.revokeObjectURL(objectURL);
  objectURL=b64ToURL(DESKTOP_DATA);
  video.src=objectURL;
  video.load();
  status.textContent=mode==='mobile'?'Portrait reception film ready.':'Reception film ready.';
  if(shouldResume)play(false);
}
video.addEventListener('playing',function(){
  pending=false;blocked=false;film.classList.add('is-playing');
  status.textContent=currentMode==='mobile'?'Portrait reception film playing.':'Silent reception film playing.';
  sync();
});
video.addEventListener('pause',function(){sync();});
video.addEventListener('canplay',function(){play(false);});
video.addEventListener('error',function(){
  pending=false;blocked=true;film.classList.remove('is-playing');
  status.textContent='The still image is shown because the video could not be loaded.';
  sync();
});
button.addEventListener('click',function(){
  if(video.paused){requested=true;blocked=false;play(true);}
  else{requested=false;video.pause();status.textContent='Reception film paused.';}
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden)video.pause();else play(false);
});
function reduceChanged(){
  requested=!reduce.matches;blocked=false;
  if(requested)play(false);
  else{
    video.pause();film.classList.remove('is-playing');
    status.textContent='Reduced-motion preference respected. Use Play video to start manually.';
    sync();
  }
}
function viewportChanged(){loadForViewport();}
if(reduce.addEventListener)reduce.addEventListener('change',reduceChanged);else if(reduce.addListener)reduce.addListener(reduceChanged);
if(portrait.addEventListener)portrait.addEventListener('change',viewportChanged);else if(portrait.addListener)portrait.addListener(viewportChanged);
window.addEventListener('pageshow',function(){loadForViewport();play(false);});
window.addEventListener('beforeunload',function(){if(objectURL)URL.revokeObjectURL(objectURL);});
loadForViewport();
sync();
})();
</script>
</body>
</html>
