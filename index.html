<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b2d">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Jonathan James Search. January 2027.">
<meta name="jjs-release" content="austin-desktop-clear-v1">
<title>Jonathan James Search | January 2027</title>
<style>
:root{color-scheme:dark;--ivory:#eee7dc;--navy:#071b2d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--navy);color:var(--ivory)}
body{font-family:Arial,Helvetica,sans-serif}
main{position:fixed;inset:0;height:100vh;height:100dvh;overflow:hidden;background:#05090e}

.film{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
video.film{opacity:0}
video.film.ready{opacity:1}
.controls{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:2;display:flex;gap:8px}
button{min-height:44px;padding:10px 15px;border:1px solid #eee7dc66;background:#071b2dcc;color:var(--ivory);border-radius:2px;font:12px Arial,Helvetica,sans-serif;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(8px)}
button:focus-visible{outline:2px solid var(--ivory);outline-offset:4px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(orientation:portrait){.film{object-fit:cover;object-position:50% 18%}.controls{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom))}}

</style>
</head>
<body>
<main aria-label="Jonathan James Search launch film">
<h1 class="sr-only">Jonathan James Search — January 2027</h1>
<picture><source media="(max-width:900px) and (orientation:portrait)" srcset="austin-mobile-approved.jpg"><img class="film" src="austin-desktop-clear.jpg" alt="JJS rooftop neon branding above the Austin skyline, January 2027"></picture>
<video class="film" id="launch-video" autoplay muted loop playsinline webkit-playsinline preload="auto" aria-label="Thirty-second Austin rooftop film">

</video>
</main>
<div class="controls">
<button id="play" type="button" hidden>Play video</button>
<button id="sound" type="button" aria-pressed="false">Sound on</button>
</div>
<p class="sr-only" id="status" role="status" aria-live="polite"></p>
<script>
(()=>{
const video=document.getElementById('launch-video');
const sound=document.getElementById('sound');
const play=document.getElementById('play');
const status=document.getElementById('status');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const portrait=matchMedia('(max-width:900px) and (orientation:portrait)');
let requested=!reduce.matches;
video.muted=true;video.defaultMuted=true;video.playsInline=true;
function syncSound(){sound.textContent=video.muted?'Sound on':'Sound off';sound.setAttribute('aria-pressed',String(!video.muted));}
async function start(explicit=false){
if(document.hidden||(!requested&&!explicit))return;
try{await video.play();play.hidden=true;}catch(e){play.hidden=false;status.textContent='Select Play video to start the film.';}
}
video.addEventListener('playing',()=>{video.classList.add('ready');play.hidden=true;});
video.addEventListener('error',()=>{video.classList.remove('ready');play.hidden=true;sound.hidden=true;status.textContent='Austin rooftop image shown. Video unavailable.';});
video.addEventListener('volumechange',syncSound);
play.addEventListener('click',()=>{requested=true;start(true);});
sound.addEventListener('click',async()=>{video.muted=!video.muted;syncSound();requested=true;await start(true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)video.pause();else start();});
reduce.addEventListener('change',()=>{requested=!reduce.matches;if(requested)start();else{video.pause();play.hidden=false;}});
function selectFilm(){
video.classList.remove('ready');
sound.hidden=false;
video.style.objectPosition=portrait.matches?'50% 18%':'center center';
video.poster=portrait.matches?'austin-mobile-approved.jpg':'austin-desktop-clear.jpg';
video.src=portrait.matches?'austin-mobile-approved.mp4':'austin-desktop-clear.mp4';
video.load();start();
}
portrait.addEventListener('change',selectFilm);
window.addEventListener('pageshow',()=>start());
selectFilm();
if(reduce.matches){video.autoplay=false;video.pause();play.hidden=false;}else start();
syncSound();
})();
</script>
</body>
</html>
